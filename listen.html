<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слушать — Свето'музыка мыслей</title>
    <style>
      body {
        margin: 0;
        font-family: "Arial", sans-serif;
        /* Тот же градиент, что и на первой странице */
        background: linear-gradient(180deg, #2b0040, #000000);
        background-attachment: fixed; /* Чтобы фон не съезжал при прокрутке */
        color: white;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      h2 {
        font-size: 2rem;
        margin-bottom: 40px;
        text-shadow: 0 0 20px rgba(122, 0, 255, 0.5);
      }

      .links-container {
        width: 100%;
        max-width: 400px;
      }

      button {
        display: block;
        width: 100%;
        margin: 15px 0;
        padding: 18px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 35px;
        background: rgba(122, 0, 255, 0.8);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px); /* Эффект матового стекла */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      button:hover {
        background: #9a33ff;
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(122, 0, 255, 0.4);
      }

      .back-btn {
        margin-top: 40px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-size: 1rem;
        width: auto;
        padding: 10px 25px;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: white;
      }
    </style>
  </head>
  <body>
    <h2>Где будем слушать?</h2>

    <div class="links-container">
      <button onclick="window.open('https://spotify.com', '_blank')">
        Spotify
      </button>

      <button
        onclick="
          window.open(
            'https://vk.com/music/album/-2000296659_26296659_4d64a09065961bbe42',
            '_blank',
          )
        "
      >
        VK Музыка
      </button>

      <button
        onclick="
          window.open('https://music.yandex.ru/artist/24218092', '_blank')
        "
      >
        Яндекс Музыка
      </button>

      <button class="back-btn" onclick="window.location.href = 'music.html'">
        ← Назад к описанию
      </button>
    </div>

    <footer style="margin-top: 50px; opacity: 0.5; font-size: 0.8rem">
      © 2026 • Свето'музыка мыслей
    </footer>
  </body>
</html>
