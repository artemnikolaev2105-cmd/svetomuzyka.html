<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слушать — Свето'музыка мыслей</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(180deg, #2b0040, #000000); background-attachment: fixed; color: white; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .links-container { width: 100%; max-width: 400px; }
        button { display: block; width: 100%; margin: 15px 0; padding: 18px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 35px; background: rgba(122, 0, 255, 0.8); color: white; cursor: pointer; transition: 0.3s; }
        button:hover { background: #9a33ff; transform: translateY(-3px); }
        .back-btn { margin-top: 30px; background: none; border: 1px solid white; font-size: 1rem; width: auto; padding: 10px 20px; opacity: 0.7; }
    </style>
</head>
<body>
    <h2>Где будем слушать?</h2>
    <div class="links-container">
        <button onclick="window.open('https://spotify.com', '_blank')">Spotify</button>
        <button onclick="window.open('https://vk.com/music/album/-2000296659_26296659_4d64a09065961bbe42', '_blank')">VK Музыка</button>
        <button onclick="window.open('https://music.yandex.ru/artist/24218092', '_blank')">Яндекс Музыка</button>
        <button class="back-btn" onclick="location.href='index.html'">← Назад</button>
    </div>
</body>
</html>
