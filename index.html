<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свето'музыка мыслей</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #0b0b0b; color: white; text-align: center; }
        header { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(180deg, #2b0040, #000000); padding: 20px; }
        h1 { font-size: 3rem; margin: 0 0 10px 0; }
        h2 { font-weight: 400; color: #7a00ff; margin-bottom: 30px; }
        button { padding: 15px 40px; border: none; border-radius: 30px; font-size: 1.2rem; cursor: pointer; background: #7a00ff; color: white; transition: 0.3s; }
        button:hover { background: #9a33ff; box-shadow: 0 0 20px rgba(122, 0, 255, 0.6); }
        .about-section { padding: 80px 20px; max-width: 600px; margin: auto; }
        .tracklist-section { padding: 80px 20px; max-width: 600px; margin: 0 auto 100px auto; background: rgba(255,255,255,0.03); border-radius: 20px; }
        .track { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #222; }
        footer { padding: 40px; opacity: 0.5; }
    </style>
</head>
<body>
    <header>
        <h1>Свето'музыка мыслей</h1>
        <h2>Новый альбом</h2>
        <button onclick="location.href='listen.html'">Слушать</button>
    </header>
    <section class="about-section">
        <h2>Об альбоме</h2>
        <p><b>Дата выхода:</b> 10.01.2026</p>
        <p><b>Количество треков:</b> 9</p>
    </section>
    <section class="tracklist-section">
        <h2>Треклист</h2>
        <div class="track"><span>1. Мутация</span><span>3:37</span></div>
        <div class="track"><span>2. Не могу уснуть</span><span>2:53</span></div>
        <div class="track"><span>3. Изнутри</span><span>1:59</span></div>
        <div class="track"><span>4. Мысык dance</span><span>3:50</span></div>
        <div class="track"><span>5. Поймай меня</span><span>1:55</span></div>
        <div class="track"><span>6. Художник</span><span>3:26</span></div>
        <div class="track"><span>7. Тревога</span><span>1:35</span></div>
        <div class="track"><span>8. Вплавь</span><span>3:34</span></div>
        <div class="track"><span>9. Паззл</span><span>3:33</span></div>
    </section>
    <footer>© 2026 • Свето'музыка мыслей</footer>
</body>
</html>
